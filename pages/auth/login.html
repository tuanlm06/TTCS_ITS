<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Thực tập sinh</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-header">
        <h1>Cổng Thực Tập Sinh</h1>
        <p>Đăng nhập để vào hệ thống quản trị và báo cáo</p>
      </div>

      <!-- Thông báo lỗi hệ thống -->
      <div id="globalAlert" class="alert hidden"></div>

      <form id="formLogin" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="loginEmail" class="form-label"
            >Địa chỉ Email <span class="required">*</span></label
          >
          <input
            type="email"
            id="loginEmail"
            class="form-control"
            placeholder="name@example.com"
            autocomplete="email"
          />
          <span class="error-msg" id="loginEmailError"></span>
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
          <label for="loginPassword" class="form-label"
            >Mật khẩu <span class="required">*</span></label
          >
          <input
            type="password"
            id="loginPassword"
            class="form-control"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
          />
          <span class="error-msg" id="loginPasswordError"></span>
        </div>

        <!-- Nút Đăng nhập -->
        <button type="submit" id="btnLogin" class="btn-submit">
          <span id="btnSpinner" class="spinner hidden"></span>
          <span id="btnText">Đăng nhập</span>
        </button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký tham gia ngay</a>
      </div>
    </div>

    <script type="module" src="../../js/auth/login.js"></script>
  </body>
</html>
