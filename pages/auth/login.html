<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập Hệ Thống - TTCS Portal</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    /* Styling bổ sung cho khối chọn tài khoản Demo nhanh */
    .demo-accounts-box {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed #cbd5e1;
      text-align: center;
    }

    .demo-title {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .demo-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-demo-chip {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-demo-chip:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>TTCS Portal</h1>
      <p>Đăng nhập hệ thống quản lý & báo cáo thực tập</p>
    </div>

    <!-- Thông báo lỗi hệ thống -->
    <div id="globalAlert" class="alert hidden"></div>

    <form id="formLogin" novalidate>
      <!-- Email -->
      <div class="form-group">
        <label for="loginEmail" class="form-label">
          Địa chỉ Email <span class="required">*</span>
        </label>
        <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" autocomplete="email"
          required />
        <span class="error-msg" id="loginEmailError"></span>
      </div>

      <!-- Mật khẩu -->
      <div class="form-group">
        <label for="loginPassword" class="form-label">
          Mật khẩu <span class="required">*</span>
        </label>
        <input type="password" id="loginPassword" class="form-control" placeholder="Nhập mật khẩu"
          autocomplete="current-password" required />
        <span class="error-msg" id="loginPasswordError"></span>
      </div>

      <!-- Nút Đăng nhập -->
      <button type="submit" id="btnLogin" class="btn-submit">
        <span id="btnSpinner" class="spinner hidden"></span>
        <span id="btnText">Đăng nhập</span>
      </button>
    </form>

    <div class="auth-footer" style="margin-top: 16px">
      Chưa có tài khoản? <a href="register.html">Đăng ký tham gia ngay</a>
    </div>
  </div>

  <script type="module" src="../../js/auth/login.js"></script>
</body>

</html>
